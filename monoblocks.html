<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mono Blocks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;700&family=Martian+Mono:wght@400;600&display=swap">
<style>
/* Layout: one drafting sheet. Hold and score flank the 10×20 well on the left, the queue and keys on the right; on phones the side column stacks beside the well and a two-row pad sits underneath. */
:root {
  --paper: #ffffff;
  --ink: #121212;
  --ink-soft: #626262;
  --rule: #d6d6d6;
  --ghost: #a0a0a0;
  --veil: rgba(255, 255, 255, 0.84);
  --font-display: "Anton", Impact, "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
  --font-mono: "Martian Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --frame: 3px;
  --cell: 30px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e0e0e; --ink: #f0f0f0; --ink-soft: #a4a4a4; --rule: #2d2d2d; --ghost: #707070;
    --veil: rgba(14, 14, 14, 0.84);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e0e0e; --ink: #f0f0f0; --ink-soft: #a4a4a4; --rule: #2d2d2d; --ghost: #707070;
  --veil: rgba(14, 14, 14, 0.84);
  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; overscroll-behavior: none; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  height: 100%;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
button { font: inherit; }

.app {
  height: 100%;
  max-width: 1040px;
  margin: 0 auto;
  padding-inline: 24px;
  padding-block: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* header */
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.brand {
  margin: 0;
  display: flex; align-items: baseline; gap: 12px;
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(26px, 3.4vw, 36px); line-height: 1; letter-spacing: 0.01em;
  white-space: nowrap;
}
.brand small { font: 400 11px/1 var(--font-mono); letter-spacing: 0.06em; color: var(--ink-soft); }
.bar-actions { display: flex; gap: 8px; }

.btn {
  appearance: none; -webkit-appearance: none;
  border: 2px solid var(--ink); border-radius: 0;
  background: var(--paper); color: var(--ink);
  font: 700 13px/1 var(--font-body);
  padding: 9px 14px; min-height: 36px;
  cursor: pointer; touch-action: manipulation; white-space: nowrap;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  transition: background-color 0.12s, color 0.12s;
}
.btn-solid { background: var(--ink); color: var(--paper); }
@media (hover: hover) {
  .btn:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
  .btn-solid:hover:not(:disabled) { background: var(--paper); color: var(--ink); }
}
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.btn:disabled { opacity: 0.35; cursor: default; }

/* stage */
.stage {
  flex: 1 1 auto; min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  grid-template-areas: "left well right";
  column-gap: 28px;
  align-items: start;
  -webkit-user-select: none; user-select: none;
}
.side { display: flex; flex-direction: column; gap: 26px; min-width: 0; }
.side-left { grid-area: left; align-items: flex-end; text-align: right; }
.side-right { grid-area: right; align-items: flex-start; }
.panel { display: flex; flex-direction: column; gap: 10px; align-items: inherit; }
.label { margin: 0; font: 700 11px/1.2 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
.preview { display: block; }

.stats { display: flex; flex-direction: column; gap: 16px; align-items: inherit; }
.stat { display: flex; flex-direction: column; gap: 5px; align-items: inherit; }
.num { font: 600 18px/1.1 var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.num-big { font-size: clamp(22px, 2.6vw, 30px); }
.num-soft { color: var(--ink-soft); }
.ticks { display: flex; gap: 3px; }
.ticks i { width: 8px; height: 8px; border: 1.5px solid var(--ink); }
.ticks i.on { background: var(--ink); }

/* the well */
.well-area { grid-area: well; display: flex; align-items: flex-start; gap: 8px; }
.ruler {
  position: relative; width: 22px; margin-block: var(--frame);
  display: grid; grid-template-rows: repeat(20, var(--cell));
}
.ruler span { position: relative; }
.ruler span::after { content: ""; position: absolute; right: 0; top: 0; width: 5px; height: 1px; background: var(--ink-soft); }
.ruler span[data-n]::after { width: 9px; background: var(--ink); }
.ruler span[data-n]::before {
  content: attr(data-n); position: absolute; right: 12px; top: 0; transform: translateY(-50%);
  font: 400 9px/1 var(--font-mono); color: var(--ink-soft);
}
.well { position: relative; border: var(--frame) solid var(--ink); background: var(--paper); touch-action: none; }
.well:focus { outline: none; }
.well canvas { display: block; }

.callout {
  position: absolute; left: 50%; top: 18%;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  width: max-content; max-width: calc(var(--cell) * 9.6);
  pointer-events: none; opacity: 0; transform: translateX(-50%);
}
.callout .tag {
  font: 400 clamp(16px, calc(var(--cell) * 0.75), 30px)/1.05 var(--font-display);
  letter-spacing: 0.03em; text-transform: uppercase; text-align: center; text-wrap: balance;
  background: var(--ink); color: var(--paper); padding: 0.3em 0.5em 0.24em;
}
.callout .subs { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.callout .sub {
  font: 600 clamp(10px, calc(var(--cell) * 0.34), 13px)/1 var(--font-mono);
  background: var(--paper); color: var(--ink); border: 1.5px solid var(--ink); padding: 0.35em 0.45em; white-space: nowrap;
}
.callout.show { animation: callout 1.2s cubic-bezier(0.2, 0.7, 0.2, 1) forwards; }
@keyframes callout {
  0% { opacity: 0; transform: translate(-50%, 8px); }
  10% { opacity: 1; transform: translate(-50%, 0); }
  78% { opacity: 1; transform: translate(-50%, 0); }
  100% { opacity: 0; transform: translate(-50%, -6px); }
}
@keyframes callout-still { 0%, 99% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .callout.show { animation: callout-still 1.2s steps(1, end) forwards; }
  .btn { transition: none; }
}

.overlay {
  position: absolute; inset: 0;
  display: grid; place-items: center; padding: 10px;
  background: var(--veil);
}
.sheet {
  width: min(100%, 15.5rem);
  background: var(--paper); border: 2px solid var(--ink);
  padding: 18px 16px 16px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  text-align: center;
}
.ov-kicker { margin: 0; font: 400 10px/1.2 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
.ov-title {
  margin: 0; font: 400 clamp(24px, var(--cell), 36px)/1.1 var(--font-display);
  letter-spacing: 0.01em; text-wrap: balance;
}
.ov-body { margin: 0; font: 500 13px/1.6 var(--font-body); text-wrap: balance; }
.ov-body b { font: 600 13px/1.6 var(--font-mono); font-variant-numeric: tabular-nums; }
.ov-actions { display: flex; flex-direction: column; align-items: stretch; gap: 8px; width: 100%; margin-top: 4px; }
.ov-hint { margin: 0; font-size: 11.5px; line-height: 1.4; color: var(--ink-soft); }
.ov-kicker:empty, .ov-body:empty, .ov-hint:empty { display: none; }

/* keys */
.keys { display: flex; flex-direction: column; gap: 10px; }
.keys dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 7px 10px; align-items: center; }
.keys dt { display: flex; gap: 3px; }
.keys dd { margin: 0; font-size: 12px; color: var(--ink-soft); }
kbd {
  display: inline-block; min-width: 22px; padding: 4px 5px 3px;
  border: 1.5px solid var(--ink); border-bottom-width: 3px;
  font: 400 10px/1 var(--font-mono); text-align: center; color: var(--ink);
}

/* touch pad */
.pad { display: none; }
.pad button {
  appearance: none; -webkit-appearance: none;
  border: 2px solid var(--ink); border-radius: 0;
  background: var(--paper); color: var(--ink);
  height: 52px; display: grid; place-items: center;
  font: 700 13px/1 var(--font-body);
  touch-action: none; cursor: pointer;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
.pad button.is-down { background: var(--ink); color: var(--paper); }
.pad .wide { grid-column: span 2; }
.pad svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: square; stroke-linejoin: miter; }

@media (pointer: coarse), (max-width: 640px) {
  .pad { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; touch-action: none; }
  .keys { display: none; }
}

@media (max-width: 640px) {
  .app { padding-inline: 16px; padding-block: 10px 12px; gap: 12px; }
  .brand { font-size: 24px; gap: 8px; }
  .btn { padding: 8px 10px; font-size: 12px; min-height: 34px; }
  .stage {
    grid-template-columns: auto minmax(0, 1fr);
    grid-template-rows: auto auto 1fr;
    grid-template-areas: "well next" "well hold" "well stats";
    column-gap: 12px; row-gap: 18px;
  }
  .side { display: contents; }
  .panel-next { grid-area: next; }
  .panel-hold { grid-area: hold; }
  .stats { grid-area: stats; gap: 12px; }
  .panel, .stats, .stat { align-items: flex-start; text-align: left; }
  .ruler { display: none; }
  .well-area { gap: 0; }
  .num { font-size: 15px; }
  .num-big { font-size: 19px; }
  .ticks { gap: 2px; }
  .ticks i { width: 6px; height: 6px; border-width: 1px; }
  .pad button { height: 50px; }
  .stage.is-compact { row-gap: 10px; }
  .stage.is-compact .stats { gap: 8px; }
  .stage.is-compact .stat-best { display: none; }
}
.stage.no-keys .keys { display: none; }
@media (max-width: 400px) {
  .brand small { display: none; }
}
@media (max-width: 359px) {
  .brand { font-size: 21px; }
  .btn { padding-inline: 8px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <h1 class="brand">Mono Blocks <small>10 × 20</small></h1>
    <div class="bar-actions">
      <button class="btn" id="btnPause" type="button" disabled>Pause</button>
      <button class="btn" id="btnNew" type="button">New game</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <aside class="side side-left">
      <section class="panel panel-hold">
        <h2 class="label">Hold</h2>
        <canvas id="holdCv" class="preview" role="img" aria-label="Held piece"></canvas>
      </section>
      <section class="stats" aria-label="Stats">
        <div class="stat"><span class="label">Score</span><output class="num num-big" id="score">0</output></div>
        <div class="stat"><span class="label">Level</span><output class="num" id="level">1</output><span class="ticks" id="ticks" aria-hidden="true"></span></div>
        <div class="stat"><span class="label">Lines</span><output class="num" id="lines">0</output></div>
        <div class="stat stat-best"><span class="label">Best</span><output class="num num-soft" id="best">0</output></div>
      </section>
    </aside>

    <div class="well-area">
      <div class="ruler" id="ruler" aria-hidden="true"></div>
      <div class="well" id="well" tabindex="-1">
        <canvas id="boardCv" role="img" aria-label="Game board"></canvas>
        <div class="callout" id="callout" aria-live="polite"></div>
        <div class="overlay" id="overlay" hidden>
          <div class="sheet" role="dialog" aria-labelledby="ovTitle">
            <p class="ov-kicker" id="ovKicker"></p>
            <h2 class="ov-title" id="ovTitle"></h2>
            <p class="ov-body" id="ovBody"></p>
            <div class="ov-actions">
              <button class="btn btn-solid" id="ovPrimary" type="button"></button>
              <button class="btn" id="ovSecondary" type="button" hidden></button>
            </div>
            <p class="ov-hint" id="ovHint"></p>
          </div>
        </div>
      </div>
    </div>

    <aside class="side side-right">
      <section class="panel panel-next">
        <h2 class="label">Next</h2>
        <canvas id="nextCv" class="preview" role="img" aria-label="Next pieces"></canvas>
      </section>
      <section class="keys" aria-label="Keyboard controls">
        <h2 class="label">Controls</h2>
        <dl>
          <dt><kbd>←</kbd><kbd>→</kbd></dt><dd>Move</dd>
          <dt><kbd>↓</kbd></dt><dd>Soft drop</dd>
          <dt><kbd>Space</kbd></dt><dd>Hard drop</dd>
          <dt><kbd>↑</kbd><kbd>X</kbd></dt><dd>Rotate clockwise</dd>
          <dt><kbd>Z</kbd></dt><dd>Rotate counterclockwise</dd>
          <dt><kbd>C</kbd><kbd>Shift</kbd></dt><dd>Hold</dd>
          <dt><kbd>P</kbd><kbd>Esc</kbd></dt><dd>Pause</dd>
        </dl>
      </section>
    </aside>
  </main>

  <nav class="pad" id="pad" aria-label="Touch controls">
    <button type="button" tabindex="-1" data-act="hold" aria-label="Hold">Hold</button>
    <button type="button" tabindex="-1" data-act="soft" aria-label="Soft drop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    <button type="button" tabindex="-1" data-act="hard" aria-label="Hard drop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M6.5 9.5L12 15l5.5-5.5M5 20.5h14"/></svg></button>
    <button type="button" tabindex="-1" data-act="ccw" aria-label="Rotate counterclockwise"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12A7 7 0 1 0 8.5 5.94"/><path d="M12.3 7.5L7.2 6.7L9.1 1.9"/></svg></button>
    <button type="button" tabindex="-1" data-act="left" aria-label="Move left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button type="button" tabindex="-1" data-act="right" aria-label="Move right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    <button type="button" tabindex="-1" data-act="cw" class="wide" aria-label="Rotate clockwise"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12A7 7 0 1 1 15.5 5.94"/><path d="M11.7 7.5L16.8 6.7L14.9 1.9"/></svg></button>
  </nav>
</div>

<script>
(() => {
  'use strict';

  /* ---------- rules ---------- */
  const COLS = 10, ROWS = 22, HIDDEN = 2, VIS = ROWS - HIDDEN;
  const TYPES = ['I', 'J', 'L', 'O', 'S', 'T', 'Z'];
  const BASE = {
    I: ['....', 'IIII', '....', '....'],
    J: ['J..', 'JJJ', '...'],
    L: ['..L', 'LLL', '...'],
    O: ['OO', 'OO'],
    S: ['.SS', 'SS.', '...'],
    T: ['.T.', 'TTT', '...'],
    Z: ['ZZ.', '.ZZ', '...'],
  };
  const rotateCW = m => m.map((_, y) => m.map((__, x) => m[m.length - 1 - x][y]).join(''));
  const cellsOf = m => {
    const out = [];
    m.forEach((row, y) => { for (let x = 0; x < row.length; x++) if (row[x] !== '.') out.push([x, y]); });
    return out;
  };
  const SHAPES = {};
  for (const t of TYPES) {
    let m = BASE[t];
    SHAPES[t] = [];
    for (let r = 0; r < 4; r++) { SHAPES[t].push(cellsOf(m)); m = rotateCW(m); }
  }

  // SRS wall kicks. These tables use +y = up, so each test is applied as (x, -y).
  const KICKS = {
    '0>1': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
    '1>0': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
    '1>2': [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
    '2>1': [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
    '2>3': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
    '3>2': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
    '3>0': [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
    '0>3': [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
  };
  const KICKS_I = {
    '0>1': [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
    '1>0': [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
    '1>2': [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
    '2>1': [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
    '2>3': [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
    '3>2': [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
    '3>0': [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
    '0>3': [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
  };

  const DAS = 0.16, ARR = 0.045, LOCK_DELAY = 0.5, MAX_RESETS = 15;
  const CLEAR_TIME = 0.24, OVER_TIME = 0.9, FLASH_TIME = 0.12;
  const CLEAR_NAMES = ['', 'Single', 'Double', 'Triple', 'Quad'];
  const gravity = level => { const n = Math.min(level, 20) - 1; return Math.pow(0.8 - n * 0.007, n); };
  const fmt = n => n.toLocaleString('en-US');
  const $ = id => document.getElementById(id);

  /* ---------- state ---------- */
  const emptyRow = () => Array(COLS).fill(null);
  const freshState = () => ({
    board: Array.from({ length: ROWS }, emptyRow),
    queue: [], hold: null, canHold: true, piece: null,
    score: 0, lines: 0, level: 1, combo: -1, b2b: false,
    status: 'ready', fallAcc: 0, clearing: null,
    overT: 0, overShown: false, flashT: 0, newBest: false,
  });
  let S = freshState();
  let best = loadBest();
  let reduceMotion = false;

  function loadBest() { try { return parseInt(localStorage.getItem('mono-blocks:best') || '0', 10) || 0; } catch (e) { return 0; } }
  function saveBest() { try { localStorage.setItem('mono-blocks:best', String(best)); } catch (e) { /* storage unavailable */ } }
  function recordBest() { if (S.score > best) { best = S.score; saveBest(); return true; } return false; }

  function refill() {
    while (S.queue.length < 7) {
      const bag = TYPES.slice();
      for (let i = bag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [bag[i], bag[j]] = [bag[j], bag[i]];
      }
      S.queue.push(...bag);
    }
  }

  function fits(type, rot, x, y) {
    for (const [cx, cy] of SHAPES[type][rot]) {
      const bx = x + cx, by = y + cy;
      if (bx < 0 || bx >= COLS || by < 0 || by >= ROWS || S.board[by][bx]) return false;
    }
    return true;
  }
  const grounded = p => !fits(p.type, p.rot, p.x, p.y + 1);
  function ghostY(p) { let y = p.y; while (fits(p.type, p.rot, p.x, y + 1)) y += 1; return y; }

  function spawn(type) {
    const y = type === 'I' ? HIDDEN - 1 : HIDDEN;
    const p = { type, rot: 0, x: type === 'O' ? 4 : 3, y, lowest: y, resets: 0, lockT: 0, lastRot: false, lastKick: -1 };
    S.piece = p;
    S.fallAcc = 0;
    if (!fits(p.type, p.rot, p.x, p.y)) { gameOver(); return false; }
    return true;
  }
  function spawnNext() { refill(); const t = S.queue.shift(); refill(); return spawn(t); }

  // Lock delay: moving or rotating on the ground restarts the timer, at most MAX_RESETS times per row reached.
  function settle(p, wasGrounded) {
    if (p.y > p.lowest) { p.lowest = p.y; p.resets = 0; p.lockT = 0; return; }
    if ((wasGrounded || grounded(p)) && p.resets < MAX_RESETS) { p.resets += 1; p.lockT = 0; }
  }
  function tryMove(dx, dy) {
    const p = S.piece;
    if (!p || !fits(p.type, p.rot, p.x + dx, p.y + dy)) return false;
    const was = grounded(p);
    p.x += dx; p.y += dy; p.lastRot = false;
    settle(p, was);
    return true;
  }
  function tryRotate(dir) {
    const p = S.piece;
    if (!p || p.type === 'O') return false;
    const to = (p.rot + (dir > 0 ? 1 : 3)) % 4;
    const tests = (p.type === 'I' ? KICKS_I : KICKS)[p.rot + '>' + to];
    const was = grounded(p);
    for (let i = 0; i < tests.length; i++) {
      const nx = p.x + tests[i][0], ny = p.y - tests[i][1];
      if (fits(p.type, to, nx, ny)) {
        p.x = nx; p.y = ny; p.rot = to; p.lastRot = true; p.lastKick = i;
        settle(p, was);
        return true;
      }
    }
    return false;
  }
  function softStep() {
    if (tryMove(0, 1)) { S.score += 1; S.fallAcc = 0; return true; }
    return false;
  }
  function hardDrop() {

  function award(n, tspin, allClear) {

    let base, hard, name;

      name = 'T-Spin' + (n ? ' ' + CLEAR_NAMES[n] : '');
    } else if (tspin === 'mini') {

      name = 'T-Spin Mini' + (n ? ' ' + CLEAR_NAMES[n] : '');

  reduceMotion = mqMotion.matches;
  if (mqMotion.addEventListener) mqMotion.addEventListener('change', e => { reduceMotion = e.matches; });

  /* ---------- loop ---------- */
  let lastTime = 0;
  function update(dt) {
    if (S.flashT > 0) S.flashT = Math.max(0, S.flashT - dt);
    if (S.status === 'over') {
      if (!S.overShown) {
        S.overT += dt;
        if (reduceMotion || S.overT >= OVER_TIME) { S.overShown = true; openOverlay('over'); }
      }
      return;
    }
    if (S.status !== 'playing') return;
    if (S.clearing) {
      S.clearing.t += dt;
      if (S.clearing.t >= S.clearing.dur) finishClear();
      return;
    }
    if (!S.piece) return;
    autoShift(dt);
    const p = S.piece;
    if (!p) return;
    const g = gravity(S.level);
    const interval = input.soft ? g / 20 : g;
    S.fallAcc += dt;
    while (S.fallAcc >= interval) {
      S.fallAcc -= interval;
      if (!fits(p.type, p.rot, p.x, p.y + 1)) { S.fallAcc = 0; break; }
      p.y += 1;
      p.lastRot = false;
      if (input.soft) S.score += 1;
      if (p.y > p.lowest) { p.lowest = p.y; p.resets = 0; p.lockT = 0; }
    }
    if (grounded(p)) {
      if (p.resets >= MAX_RESETS) lockPiece();
      else { p.lockT += dt; if (p.lockT >= LOCK_DELAY) lockPiece(); }
    } else {
      p.lockT = 0;
    }
  }
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - lastTime) / 1000));
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  /* ---------- start ---------- */
  // The opening screen shows a sample stack behind the start card; it is cleared when a game begins.
  function demoState() {
    const s = freshState();
    const rows = ['.OO.Z.SS..', 'JOOZZSSSS.', 'JJJZOOSSL.', 'IIIIOOLLL.'];
    rows.forEach((r, i) => {
      const y = ROWS - rows.length + i;
      for (let x = 0; x < COLS; x++) if (r[x] !== '.') s.board[y][x] = r[x];
    });
    s.piece = { type: 'T', rot: 0, x: 3, y: HIDDEN + 4, lowest: HIDDEN + 4, resets: 0, lockT: 0, lastRot: false, lastKick: -1 };
    return s;
  }
  function boot(data) {
    readColors();
    const saved = data && data.S;
    if (saved && Array.isArray(saved.board) && saved.board.length === ROWS && saved.status !== 'ready') {
      S = saved;
      best = Math.max(best, data.best || 0);
      if (S.status === 'playing') S.status = 'paused';
      if (S.status === 'paused') openOverlay('paused');
      else { S.status = 'over'; S.overShown = true; openOverlay('over'); }
    } else {
      S = demoState();
      refill();
      openOverlay('ready');
    }
    syncButtons();
    layout();
    requestAnimationFrame(t => { lastTime = t; frame(t); });
  }

  // When the page runs as a Claude artifact, this keeps the current game through live updates. Elsewhere `hot` is undefined and the game just boots.
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ S: JSON.parse(JSON.stringify(S)), best }));
  if (hot && typeof hot.ready === 'function') hot.ready(boot);
  else boot((hot && hot.data) || {});
})();
</script>
</body>
